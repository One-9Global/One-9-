tles and meta can be managed consistently for each page.\",\"builder_seo_audit_issue_why_unexpected_noindex\":\"A noindex tag tells search engines not to list this page — remove it if you want this page found in search.\",\"builder_seo_audit_issue_why_invalid_canonical_url\":\"Canonical URL must be absolute so search engines index the correct live page.\",\"builder_seo_audit_issue_why_invalid_twitter_image_url\":\"Twitter requires an absolute image URL for card previews to render correctly.\",\"builder_seo_audit_issue_why_missing_twitter_image\":\"Twitter image meta sets the preview thumbnail on X — missing images get less engagement.\",\"builder_seo_audit_issue_why_missing_twitter_card\":\"Twitter card meta controls how your link appears on X — without it, previews may be incomplete.\",\"builder_seo_audit_issue_why_missing_og_type\":\"Open Graph type hints what kind of content is being shared (e.g. website, article), improving preview accuracy.\",\"builder_seo_audit_issue_why_invalid_og_url_url\":\"Open Graph URL must be absolute so social platforms can link to the correct page.\",\"builder_seo_audit_issue_why_empty_og_url\":\"An empty Open Graph URL can cause the wrong page to be associated with social shares.\",\"builder_seo_audit_issue_why_missing_og_url\":\"Open Graph URL tells platforms which canonical page is being shared — it should match your live page URL.\",\"builder_seo_audit_issue_why_empty_og_image\":\"An empty Open Graph image URL means social shares will not show a preview image.\",\"builder_seo_audit_issue_why_empty_og_description\":\"An empty Open Graph description reduces control over how your page looks when shared.\",\"builder_seo_audit_issue_why_missing_og_description\":\"Open Graph description appears in social link previews — without it, platforms may show unrelated page text.\",\"builder_seo_audit_issue_why_missing_og_title\":\"Open Graph title controls how your page appears when shared on social platforms and in some search previews.\",\"builder_seo_audit_issue_why_empty_json_ld\":\"An empty JSON-LD block provides no structured data, so AI and search tools cannot reliably interpret this page.\",\"builder_seo_audit_issue_why_missing_h1\":\"The H1 tells visitors and search engines what the page is about — it should clearly describe the main topic.\",\"builder_seo_audit_issue_why_empty_title\":\"An empty title gives search engines nothing useful to show in results, which hurts click-through rates.\",\"builder_seo_audit_issue_why_fetch_failed\":\"We could not load this page's HTML — fixes may not appear in results until the page is reachable.\",\"builder_seo_audit_col_aeo\":\"AEO\",\"builder_seo_audit_tab_seo\":\"SEO\",\"builder_seo_audit_empty_seo\":\"No SEO issues found on checked routes.\",\"builder_seo_audit_schema_recommended_types\":\"Recommended types\",\"builder_seo_audit_schema_status_heading\":\"JSON-LD status on this page\",\"builder_domain_list_no_results\":\"No domains match \\\"{query}\\\".\",\"builder_free_publish_panel_benefit_3\":\"Keep building with monthly Airo credits\",\"builder_free_publish_panel_custom_domain_hint\":\"Custom domains are available when you upgrade.\",\"builder_common_continue\":\"Continue\",\"builder_header_undo\":\"Undo\",\"devtools_image_action_link_error_scheme\":\"Only http, https, mailto, and tel links are allowed.\",\"builder_share_access_label\":\"Invite\",\"builder_share_access_dialog_label\":\"Invite\",\"builder_share_access_close\":\"Close\",\"builder_team_pending_venture\":\"Team collaboration will be available shortly. Please check back in a few minutes.\",\"builder_team_not_enabled\":\"Team settings are not enabled for this account.\",\"builder_projects_col_updated\":\"Updated on\",\"builder_projects_empty_search\":\"No projects match your search\",\"builder_projects_status_aria\":\"Filter by status\",\"builder_projects_updated\":\"Updated {date}\",\"builder_projects_view_aria\":\"View mode\",\"builder_projects_view_grid\":\"Grid view\",\"builder_project  business and should consult qualified legal, security, compliance, or industry professionals as needed.\",\"builder_manageplan_faq_security_question\":\"Is my Airo AI Builder app compliant with industry specific security standards or regulatory requirements?\",\"builder_manageplan_faq_otheraccounts_answer\":\"Credits can only be used for Airo AI Builder in the GoDaddy account they were purchased from.\",\"builder_manageplan_faq_otheraccounts_question\":\"Can I use AI credits for my other GoDaddy services or accounts?\",\"builder_manageplan_faq_wheretosee_answer\":\"You can view your remaining credits in Airo AI Builder — go to your Manage My Plan page and look under Total AI Credit Usage.\",\"builder_manageplan_faq_wheretosee_question\":\"Where can I see my remaining AI credits?\",\"builder_manageplan_faq_buymore_answer\":\"Airo Builder uses credits in order of expiration, starting with those expiring soonest — this includes both free and paid credits. Purchased credits expire one year from the time of purchase. To buy more, go to your Airo AI Builder Manage My Plan page, then select Buy AI Credits for a one-time purchase, or select Upgrade for a higher monthly credit limit.\",\"builder_manageplan_faq_buymore_question\":\"How can I purchase more AI credits?\",\"builder_manageplan_faq_outofcredits_answer\":\"When you run out of credits, a message appears that includes the time your free monthly limit resets, along with the option to upgrade to add more credits.\",\"builder_manageplan_faq_outofcredits_question\":\"How do I know when I've run out of AI credits?\",\"builder_manageplan_faq_freeactions_b9\":\"Restore your app to a previous version using History\",\"builder_manageplan_faq_freeactions_b8\":\"Edit, upload and manage your app or site visuals using Media\",\"builder_manageplan_faq_freeactions_b7\":\"Upload images, videos or files using Menu\",\"builder_manageplan_faq_freeactions_b6\":\"View your remaining AI credits and reset time\",\"builder_manageplan_faq_f
